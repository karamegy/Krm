<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسرار غابات الأمازون - الواجهة الرئيسية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <header>
            <h1>أدغال الأمازون الغامضة</h1>
            <p id="welcome-msg">عالم من المغامرة والبقاء في انتظارك...</p>
        </header>

        <div class="menu-grid">
            <button class="menu-btn" onclick="navigateTo('game.html')">🎮 مغامرة طرزان</button>
            <button class="menu-btn" onclick="navigateTo('auth.html')">👤 تسجيل / دخول</button>
            <button class="menu-btn" onclick="navigateTo('admin.html')">🛠️ لوحة الإدارة</button>
            <button class="menu-btn" onclick="alert('قسم الأسرار والخرائط قيد التحديث للغموض الأكبر!')">🗺️ خريطة الغابة</button>
            <button class="menu-btn full-width" onclick="logout()" style="background: #c0392b;">🚪 تسجيل الخروج</button>
        </div>
    </div>

    <script>
        function navigateTo(page) {
            window.location.href = page;
        }

        // فحص العضو النشط
        window.onload = function() {
            let activeUser = localStorage.getItem('activeUser');
            if(activeUser) {
                document.getElementById('welcome-msg').innerText = `أهلاً بك مجدداً أيها المستكشف: ${activeUser}`;
            }
        }

        function logout() {
            localStorage.removeItem('activeUser');
            alert('تم تسجيل الخروج بنجاح.');
            location.reload();
        }
    </script>
</body>
</html>
